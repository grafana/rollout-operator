groups:
    - name: rollout_operator_alerts
      rules:
        - alert: rollout-operatorIncorrectWebhookConfigurationFailurePolicy
          annotations:
            message: |
                A validating or mutating rollout-operator webhook has an Ignore policy set. This should be set to Fail.
            runbook_url: https://github.com/grafana/rollout-operator/tree/main/docs/runbooks.md#rollout-operatorincorrectwebhookconfigurationfailurepolicy
          expr: count by(type, webhook, namespace) (kube_validating_webhook_failure_policy{policy="Ignore", webhook=~"^(pod-eviction|zpdb-validation).+"} > 0)
          for: 5m
          labels:
            severity: warning
        - alert: rollout-operatorBadZoneAwarePodDisruptionBudgetConfiguration
          annotations:
            message: An invalid zone aware pod disruption budget configuration has been observed.
            runbook_url: https://github.com/grafana/rollout-operator/tree/main/docs/runbooks.md#rollout-operatorbadzoneawarepoddisruptionbudgetconfiguration
          expr: sum by (job, namespace)(rate(rollout_operator_zpdb_configurations_observed_total{result="invalid"}[5m])) > 0
          for: 5m
          labels:
            severity: warning
        - alert: rollout-operatorHighNumberInflightZpdbRequests
          annotations:
            message: A sustained number of inflight ZPDB eviction requests has been observed.
            runbook_url: https://github.com/grafana/rollout-operator/tree/main/docs/runbooks.md#rollout-operatorhighnumberinflightzpdbrequests
          expr: avg_over_time(rollout_operator_zpdb_inflight_eviction_requests[5m]) > 10
          for: 5m
          labels:
            severity: warning
        - alert: rollout-operatorKubernetesAPIClientRateLimited
          annotations:
            message: The rollout-operator is dropping Kubernetes API requests against the {{ $labels.api_group }} API group because its client-side rate limiter is exhausted.
            runbook_url: https://github.com/grafana/rollout-operator/tree/main/docs/runbooks.md#rollout-operatorkubernetesapiclientratelimited
          expr: sum by (namespace, api_group) (rate(rollout_operator_kubernetes_api_client_rate_limited_requests_total[5m])) > 0
          for: 15m
          labels:
            severity: warning
        - alert: rollout-operatorKubernetesAPIClientApproachingRateLimit
          annotations:
            message: The rollout-operator pod {{ $labels.pod }}'s {{ $labels.component }} client is sustaining over 80% of its configured client-side rate limit for the {{ $labels.api_group }} Kubernetes API group. It is not yet dropping requests, but is at risk of doing so.
            runbook_url: https://github.com/grafana/rollout-operator/tree/main/docs/runbooks.md#rollout-operatorkubernetesapiclientapproachingratelimit
          expr: |
            sum by (namespace, pod, component, api_group) (rate(rollout_operator_kubernetes_api_client_request_duration_seconds_count[5m]))
            / on (namespace, pod, component) group_left()
            max by (namespace, pod, component) (rollout_operator_kubernetes_api_client_rate_limit_qps)
            > 0.8
          for: 10m
          labels:
            severity: warning
